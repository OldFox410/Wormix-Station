
- type: martialArt
  id: Combatives
  martialArtsForm: Combatives
  roundstartCombos: CombativesMoves

- type: comboList
  id: CombativesMoves
  combos:
  - CombativesChoke          # Grab -> Grab -> Grab -> Grab
  - CombativesRestrain       # Grab -> Grab -> Disarm
  - CombativesPummel         # Disarm -> Disarm -> Harm
  - CombativesKnockdown      # Harm -> Harm -> Disarm
  - CombativesThrow          # Grab -> Disarm
  - CombativesSlitThroat     # Grab -> Harm
  - CombativesWeakening      # Disarm -> Disarm
  - CombativesDisarm         # Harm -> Disarm

- type: combo
  id: CombativesRestrain
  name: Restrain
  martialArtsForm: Combatives
  attacks:
  - Grab
  - Grab
  - Disarm
  event: !type:CombativesRestrainPerformedEvent

- type: combo
  id: CombativesThrow
  name: Throw
  martialArtsForm: Combatives
